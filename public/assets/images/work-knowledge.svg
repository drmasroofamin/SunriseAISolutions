<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Knowledge assistant concept</title><desc>A concept knowledge-search interface presents an answer and linked source cards using abstract document graphics.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d8dde3"/><stop offset="1" stop-color="#a6b0bd"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#27354c"/><stop offset="1" stop-color="#17243a"/></linearGradient></defs>
  <rect width="1200" height="900" fill="url(#bg)"/><circle cx="57" cy="965" r="500" fill="#f6f7f9" fill-opacity=".24"/>
  <rect x="126" y="138" width="950" height="608" rx="20" fill="#273448" fill-opacity=".12"/><rect x="111" y="121" width="950" height="608" rx="20" fill="url(#panel)"/>
  <path d="M355 121V729" stroke="#ffffff" stroke-opacity=".09"/><path d="M111 193H1061" stroke="#ffffff" stroke-opacity=".09"/>
  <text x="144" y="165" fill="#e0e5ec" font-family="Arial,sans-serif" font-size="14" letter-spacing="1">KNOWLEDGE / AI</text><text x="934" y="165" fill="#9aa8bb" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">CONCEPT</text>
  <rect x="137" y="226" width="191" height="41" rx="6" fill="#ffffff" fill-opacity=".06"/><path d="M151 240H160V252H151ZM153 244H158M153 248H158" fill="none" stroke="#b7c3d4"/><text x="173" y="252" fill="#c1ccda" font-family="Arial,sans-serif" font-size="11">Approved knowledge</text>
  <text x="144" y="318" fill="#7e8da3" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">WORKSPACE</text><text x="144" y="357" fill="#b9c5d6" font-family="Arial,sans-serif" font-size="12">Team processes</text><text x="144" y="393" fill="#8797ae" font-family="Arial,sans-serif" font-size="12">Policies &amp; guides</text><text x="144" y="429" fill="#8797ae" font-family="Arial,sans-serif" font-size="12">Shared documents</text>
  <text x="402" y="251" fill="#dae1eb" font-family="Arial,sans-serif" font-size="24">Find the useful part.</text><text x="402" y="284" fill="#8595ad" font-family="Arial,sans-serif" font-size="12">A clearer route through your business knowledge.</text>
  <rect x="402" y="320" width="610" height="51" rx="8" fill="#0f1d33" stroke="#bec9d8" stroke-opacity=".14"/><circle cx="424" cy="343" r="6" fill="none" stroke="#9eacc0" stroke-width="1.5"/><path d="M429 348L434 353" stroke="#9eacc0" stroke-width="1.5"/><text x="450" y="350" fill="#b3bed0" font-family="Arial,sans-serif" font-size="12">Where can I find our onboarding process?</text>
  <rect x="402" y="398" width="610" height="125" rx="9" fill="#ffffff" fill-opacity=".04"/><text x="425" y="433" fill="#d0d9e5" font-family="Arial,sans-serif" font-size="13">Start with the approved team guide.</text><text x="425" y="459" fill="#96a5bb" font-family="Arial,sans-serif" font-size="12">Review the source document to confirm the details</text><text x="425" y="482" fill="#96a5bb" font-family="Arial,sans-serif" font-size="12">and find the next step for your team.</text>
  <text x="402" y="563" fill="#8b9bb1" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.8">REFERENCED INFORMATION</text>
  <rect x="402" y="585" width="295" height="88" rx="8" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/><rect x="718" y="585" width="294" height="88" rx="8" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
  <path d="M423 606H439V627H423ZM427 612H435M427 617H435M427 622H432M739 606H755V627H739ZM743 612H751M743 617H751M743 622H748" fill="none" stroke="#cfb192" stroke-width="1.3"/>
  <text x="454" y="617" fill="#c5cfdd" font-family="Arial,sans-serif" font-size="11">Team onboarding guide</text><text x="454" y="643" fill="#8090a9" font-family="Arial,sans-serif" font-size="10">Example source document</text><text x="770" y="617" fill="#c5cfdd" font-family="Arial,sans-serif" font-size="11">Process checklist</text><text x="770" y="643" fill="#8090a9" font-family="Arial,sans-serif" font-size="10">Example source document</text>
