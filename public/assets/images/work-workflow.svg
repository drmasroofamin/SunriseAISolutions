<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Connected onboarding concept</title><desc>An illustrative automation canvas links an enquiry, CRM record and team handoff without presenting real performance data.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18253d"/><stop offset="1" stop-color="#526073"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9e0ea" fill-opacity=".15"/></pattern></defs>
  <rect width="1200" height="900" fill="url(#bg)"/><rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="1230" cy="900" r="550" fill="#d4dce6" fill-opacity=".06"/>
  <text x="95" y="125" fill="#e4e8ef" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">CONNECTED OPERATIONS</text><text x="95" y="172" fill="#a7b4c6" font-family="Arial,sans-serif" font-size="15">An illustrative path from enquiry to onboarding.</text>
