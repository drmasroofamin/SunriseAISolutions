<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Customer support concept</title><desc>An abstract product card and a helpful support chat demonstrate a potential e-commerce assistant.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#a5afbc"/><stop offset="1" stop-color="#e3e5e8"/></linearGradient><linearGradient id="product" x2="1" y2="1"><stop stop-color="#d2d6db"/><stop offset=".55" stop-color="#f0f2f4"/><stop offset="1" stop-color="#828e9f"/></linearGradient></defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1070" cy="93" r="360" fill="#ffffff" fill-opacity=".19"/>
  <path d="M0 740L1200 580V900H0Z" fill="#142036" fill-opacity=".08"/>
  <rect x="154" y="180" width="442" height="540" rx="18" fill="#f1f3f5"/>
  <text x="188" y="225" fill="#697587" font-family="Arial,sans-serif" font-size="10" letter-spacing="2.5">PRODUCT INFORMATION</text>
  <rect x="188" y="256" width="374" height="283" rx="9" fill="#dce0e5"/>
  <ellipse cx="373" cy="491" rx="112" ry="17" fill="#263246" fill-opacity=".12"/>
  <path d="M301 326L411 301L449 455L339 480Z" fill="url(#product)"/>
  <path d="M301 326L323 307L433 283L411 301Z" fill="#fafbfc"/><path d="M411 301L433 283L471 437L449 455Z" fill="#9ca6b3"/>
  <path d="M331 350L402 333M340 385L411 368M349 420L420 403" stroke="#a8b1bd" stroke-width="3"/>
  <text x="188" y="580" fill="#263247" font-family="Arial,sans-serif" font-size="24">Details, made clearer.</text>
  <path d="M188 611H475M188 630H425" stroke="#c5ccd5" stroke-width="7" stroke-linecap="round"/>
  <text x="188" y="678" fill="#9a795b" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">ILLUSTRATIVE INTERFACE</text>
  <rect x="622" y="137" width="423" height="579" rx="19" fill="#18253d"/>
  <circle cx="665" cy="181" r="17" fill="#d8b692"/><path d="M665 170V192M654 181H676M658 174L672 188M658 188L672 174" stroke="#25324a"/>
  <text x="696" y="178" fill="#e2e7ed" font-family="Arial,sans-serif" font-size="14">Shopping assistant</text><text x="696" y="197" fill="#94a0b1" font-family="Arial,sans-serif" font-size="10">A helpful answer starts here.</text>
  <path d="M622 224H1045" stroke="#ffffff" stroke-opacity=".1"/>
  <rect x="721" y="262" width="290" height="72" rx="11" fill="#354159"/><text x="743" y="292" fill="#e0e5ed" font-family="Arial,sans-serif" font-size="13">Where can I find delivery</text><text x="743" y="314" fill="#e0e5ed" font-family="Arial,sans-serif" font-size="13">information?</text>
  <rect x="654" y="361" width="314" height="134" rx="11" fill="#ffffff" fill-opacity=".055"/><text x="675" y="393" fill="#c8d1dd" font-family="Arial,sans-serif" font-size="13">I can help you find the</text><text x="675" y="416" fill="#c8d1dd" font-family="Arial,sans-serif" font-size="13">information you need, or</text><text x="675" y="439" fill="#c8d1dd" font-family="Arial,sans-serif" font-size="13">connect you with the team.</text><text x="675" y="476" fill="#d8b692" font-family="Arial,sans-serif" font-size="11">View delivery information ↗</text>
  <rect x="654" y="530" width="245" height="35" rx="17" fill="none" stroke="#c2a687" stroke-opacity=".45"/><text x="674" y="552" fill="#c5ae93" font-family="Arial,sans-serif" font-size="11">I'd like to speak with someone</text>
  <rect x="654" y="626" width="359" height="49" rx="8" fill="#0e1a2e" stroke="#ffffff" stroke-opacity=".1"/><text x="674" y="656" fill="#8190a5" font-family="Arial,sans-serif" font-size="12">Ask a question…</text><path d="M978 640L990 650L978 660M976 650H990" fill="none" stroke="#d8b692" stroke-width="1.5"/>
</svg>
