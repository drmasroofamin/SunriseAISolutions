<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Intelligence in motion</title><desc>An abstract silver sphere rests among architectural planes, soft light and a fine sunrise-coloured orbit.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18253d"/><stop offset="1" stop-color="#080e19"/></linearGradient>
    <linearGradient id="wall"><stop stop-color="#959ca8"/><stop offset=".46" stop-color="#d6d9dd"/><stop offset="1" stop-color="#667181"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#697586"/><stop offset="1" stop-color="#141e30"/></linearGradient>
    <radialGradient id="orb" cx=".34" cy=".27" r=".75"><stop stop-color="#fff"/><stop offset=".25" stop-color="#e9ebef"/><stop offset=".6" stop-color="#929ca9"/><stop offset=".85" stop-color="#354052"/><stop offset="1" stop-color="#182235"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#dce1e9" stop-opacity=".32"/><stop offset="1" stop-color="#dce1e9" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="circle"><circle cx="1000" cy="565" r="310"/></clipPath>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1050" cy="460" r="650" fill="url(#halo)"/>
  <path d="M0 0H420L770 845H0Z" fill="#334054"/><path d="M0 0H225L595 845H432Z" fill="url(#wall)"/>
  <path d="M0 845H1600V1200H0Z" fill="url(#floor)"/>
  <path d="M0 845H1600M450 845L0 1200M770 845L710 1200M1100 845L1420 1200" stroke="#b2bbc9" stroke-opacity=".12"/>
  <path d="M1310 0H1600V845H1470Z" fill="#c9cfd7" fill-opacity=".17"/><path d="M1420 0H1450L1595 845H1560Z" fill="#e5e8ed" fill-opacity=".24"/>
  <ellipse cx="1007" cy="935" rx="360" ry="62" fill="#000713" fill-opacity=".65" filter="url(#blur)"/>
  <circle cx="1000" cy="565" r="310" fill="url(#orb)"/>
  <g clip-path="url(#circle)" fill="none" stroke="#f4f6f9" stroke-opacity=".18">
    <ellipse cx="1000" cy="565" rx="315" ry="92"/><ellipse cx="1000" cy="565" rx="315" ry="190"/><ellipse cx="1000" cy="565" rx="230" ry="310"/><ellipse cx="1000" cy="565" rx="110" ry="310"/>
    <path d="M690 565H1310M1000 250V880"/>
  </g>
  <ellipse cx="1000" cy="565" rx="438" ry="129" transform="rotate(-26 1000 565)" fill="none" stroke="#d6a77c" stroke-opacity=".7" stroke-width="1.3"/>
  <circle cx="1368" cy="346" r="6" fill="#e9c9a7"/>
  <path d="M74 1107H336M74 1107V1087M336 1107V1087" stroke="#b8c0cd" stroke-opacity=".35"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity=".55"/>
</svg>
